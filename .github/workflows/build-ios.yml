name: Build iOS App

on:
  push:
    branches: [ "main" ] # Or "master" if your default branch is master
  workflow_dispatch: # Allows you to run it manually

jobs:
  build-ios:
    name: Build IPA
    runs-on: macos-latest # This gives you a free virtual Mac!

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Add iOS Platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv ios/App/build/Release-iphoneos/App.app Payload/
          zip -r RussianCheckers.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RussianCheckers-IPA
          path: RussianCheckers.ipa
